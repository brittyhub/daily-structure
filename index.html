<script>
window.storage={
  get:function(k){try{var v=localStorage.getItem('ds_'+k);if(v===null)return Promise.reject(new Error('nf'));return Promise.resolve({value:v});}catch(e){return Promise.reject(e);}},
  set:function(k,v){try{localStorage.setItem('ds_'+k,typeof v==='string'?v:String(v));return Promise.resolve({key:k,value:v});}catch(e){return Promise.reject(e);}}

<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

  wine:'#863B56', wineBorder:'#5A2038',
  elder:'#5B1B3A', elderBorder:'#3A0A24',
  sand2:'#E5C1A1', muted:'#A08A6A',
  ink:'#3A2A1A', border:'#D4B890',
};
const GEO="Georgia,'Times New Roman',serif";
const CP="'Courier Prime',monospace";

  {id:'morning', label:'Morning',  bg:P.poppy,  border:P.poppyBorder, txt:'#FDF0E8', cht:P.poppy},
  {id:'work',    label:'Work',     bg:P.grass,  border:P.grassBorder, txt:'#F5EAD8', cht:P.grass},
  {id:'life',    label:'Life',     bg:P.terra,  border:P.terraBorder, txt:'#F5EAD8', cht:P.terra},
  {id:'leisure', label:'Leisure',  bg:P.wine,   border:P.wineBorder,  txt:'#F5EAD8', cht:P.wine},
  {id:'bedtime', label:'Bedtime',  bg:P.elder,  border:P.elderBorder, txt:P.sand2,   cht:P.elder},
];

const HAIR={
  A:{label:'Reset + Volume',tag:'Wash A',color:P.poppy,subtitle:'1x per week — clarifying wash',sections:[
    {h:'Before Shower',items:['EverPure Bond Repair Pre-Shampoo — mids + ends only','Leave on 10 minutes before stepping in']},
    {h:'Shampoo',items:["L'Oréal Clarify shampoo",'Double cleanse if lots of dry shampoo buildup']},
    {h:'Condition',items:['Pantene Grow Abundant conditioner — mids/ends only']},
    {h:'Post-Wash',items:['IGK Good Behavior spray','Elvive Glycolic Leave-In — small amount, mostly ends']},
    {h:'Style',items:['Shark FlexStyle / Airwrap']},
    {h:'Tonight — don\'t forget',items:['Fleur serum on scalp before bed ←']},
  ]},
  B:{label:'Softness + Strength',tag:'Wash B',color:P.terra,subtitle:'2-4 days after Wash A',sections:[
    {h:'Shampoo',items:['Pantene Grow Abundant shampoo']},
    {h:'Conditioning — choose ONE (not both)',items:['Blake Brown mask ← recommended for you',"Trader Joe's mask — alternative"]},
    {h:'Post-Wash',items:['IGK Good Behavior spray','Elvive Glycolic serum — tiny amount on ends only']},
    {h:'Tonight — don\'t forget',items:['Fleur serum on scalp before bed ←']},
  ]},
  C:{label:'Good Hair Day',tag:'Wash C',color:P.grass,subtitle:'Optional — going out / glossy hair',sections:[
    {h:'Shampoo',items:['Pantene shampoo']},
    {h:'Condition',items:['Light conditioner only']},
    {h:'Gloss',items:['Playa Gloss Rinse']},
  ]},

const DEFAULT_JOY=[
  'Check Rodeo for upcoming events worth adding to the calendar',
  'Look up new album releases this week',
  'Check if any exhibitions or shows are closing soon',
  'Find a book to start next — check your reading list',
  'Scan concert listings — anything worth proposing to Adam?',
  'Check saved restaurants or cafes you\'ve been meaning to try',
  'Find a fun local errand to attach to Friday\'s outing',
  'Read one saved newsletter or Substack',
  'Text a friend you\'ve been meaning to catch up with',
  'Browse a bookstore site — wishlisting only, no buying',
  'Do a crossword or word game',
  'Put on an album and actually listen to it, start to finish',
  'Flip through a magazine or coffee table book',
  'Plan a future trip or day out, even just as a daydream',
];

const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const todayStr=()=>new Date().toISOString().split('T')[0];
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const dateStr=d=>d.toISOString().split('T')[0];
const fmtDate=d=>(DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()).toUpperCase();
const getWeekKey=()=>{const d=new Date();const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);const m=new Date(d);m.setDate(diff);return m.toISOString().split('T')[0];};

function getAutoBlock(){
  const h=new Date().getHours();
  if(h<10)return 'morning';
  if(h<15)return 'work';
  if(h<17)return 'life';
  if(h<21)return 'leisure';
  return 'bedtime';
}

function dailyDelight(items,offset){
  if(!items.length)return null;
  const d=addDays(new Date(),offset);
  const seed=parseInt(dateStr(d).replace(/-/g,''));
  return items[seed%items.length];
}

function suggestDay(due){
  if(!due)return null;
  const d=new Date(due+'T12:00:00');
  const dow=d.getDay();
  if(dow===1||dow===5)return null;
  const daysToFri=((5-dow+7)%7)||7;
  const fri=addDays(d,-daysToFri);
  if(fri>=new Date())return'Friday '+fri.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return null;
}

// SVG checkmark
const Chk=()=><svg width="11" height="11" viewBox="0 0 11 11"><polyline points="2,5.5 4.5,8 9,3" stroke="#fff" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>;

// Checkbox box
function CkBox({done,color,onClick,light}){
  return(
    <div onClick={onClick} style={{
      width:19,height:19,border:`1.5px solid ${done?color:(light?'rgba(255,255,255,0.3)':'rgba(58,42,26,0.2)')}`,
      background:done?color:'transparent',flexShrink:0,
      display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',
    }}>
      {done&&<Chk/>}
    </div>
  );
}

// CheckRow
function CheckRow({id,text,note,color,checks,toggle,isLast}){
  const done=!!checks[id];
  return(
    <div onClick={()=>toggle(id)} style={{
      display:'flex',alignItems:'flex-start',gap:11,padding:'9px 0',
      borderBottom:isLast?'none':`0.5px solid rgba(58,42,26,0.1)`,cursor:'pointer',
    }}>
      <CkBox done={done} color={color} />
      <div style={{flex:1,marginTop:1}}>
        <span style={{fontSize:13,textDecoration:done?'line-through':'none',opacity:done?0.4:1}}>{text}</span>
        {note&&<div style={{fontFamily:CP,fontSize:10,color:P.muted,marginTop:2}}>{note}</div>}
      </div>
    </div>
  );
}

// Hair bottom sheet
function HairSheet({onClose,lastHairWash,setLastHairWash}){

  const [sel,setSel]=useState(suggested);

  return(
    <div style={{position:'fixed',inset:0,zIndex:200}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(58,42,26,0.55)'}}/>
      <div style={{position:'absolute',bottom:0,left:0,right:0,background:P.sand,maxHeight:'86vh',overflowY:'auto'}}>
        <div style={{display:'flex',justifyContent:'center',padding:'12px 0 4px'}}>
          <div style={{width:36,height:4,background:P.border}}/>
        </div>
        <div style={{padding:'4px 20px 48px'}}>
          <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:P.muted,marginBottom:14}}>Hair Wash Protocol</div>
          <div style={{display:'flex',gap:6,marginBottom:18}}>
            {['A','B','C'].map(k=>(
              <button key={k} onClick={()=>pick(k)} style={{
                flex:1,padding:'10px 6px',border:`1.5px solid ${sel===k?HAIR[k].color:P.border}`,
                background:sel===k?HAIR[k].color+'18':P.sandCard,cursor:'pointer',fontFamily:CP,
              }}>
                <div style={{fontSize:11,fontWeight:'bold',color:HAIR[k].color,letterSpacing:'0.06em'}}>{HAIR[k].tag}</div>
                <div style={{fontSize:10,color:P.muted,marginTop:2,lineHeight:1.3}}>{HAIR[k].label}</div>
              </button>
            ))}
          </div>
          <div style={{fontFamily:CP,fontSize:11,color:P.muted,fontStyle:'italic',marginBottom:16}}>
            {proto.subtitle}{lastHairWash&&' · last: '+HAIR[lastHairWash]?.tag}
          </div>
          {proto.sections.map((sec,si)=>(
            <div key={si} style={{marginBottom:16}}>
              <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.12em',textTransform:'uppercase',color:P.muted,marginBottom:8}}>{sec.h}</div>
              {sec.items.map((item,ii)=>(
                <div key={ii} style={{display:'flex',gap:10,padding:'8px 0',borderBottom:`0.5px solid ${P.border}`,alignItems:'flex-start'}}>
                  <div style={{width:5,height:5,background:proto.color,flexShrink:0,marginTop:5}}/>
                  <span style={{fontSize:13,lineHeight:1.45,color:P.ink}}>{item}</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>

}

// Task card
function TaskCard({task,onToggle,onDelete}){
  const PC={
    high:{bg:'#F0D8D4',color:'#87332B',border:'#C8A090'},
    mid:{bg:'#E8D8C4',color:P.ash,border:'#C8B080'},
    low:{bg:'#E0DCC4',color:'#5A5030',border:'#B8A870'},
  };
  const pc=PC[task.priority||'mid'];
  const overdue=task.dueDate&&task.dueDate<todayStr()&&!task.done;
  return(
    <div style={{background:P.sandCard,border:`0.5px solid ${overdue?P.poppy:P.border}`,padding:'11px 12px',opacity:task.done?0.5:1}}>
      <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
        <CkBox done={task.done} color={P.grass} onClick={()=>onToggle(task.id)}/>
        <div style={{flex:1}}>
          <div style={{fontSize:14,textDecoration:task.done?'line-through':'none',marginBottom:5,lineHeight:1.4}}>{task.text}</div>
          <div style={{display:'flex',gap:3,flexWrap:'wrap',alignItems:'center'}}>
            <span style={{fontFamily:CP,fontSize:9,padding:'2px 6px',background:pc.bg,color:pc.color,border:`0.5px solid ${pc.border}`}}>
              {(task.priority||'mid').charAt(0).toUpperCase()+(task.priority||'mid').slice(1)}
            </span>
            {task.dueDate&&(
              <span style={{fontFamily:CP,fontSize:9,color:overdue?P.poppy:P.muted}}>
                {overdue?'⚠ overdue · ':'due '}
                {new Date(task.dueDate+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}
              </span>
            )}
            <span style={{fontFamily:CP,fontSize:9,padding:'2px 6px',
              background:task.type==='work'?'#E0DCC4':'#E8D8C4',
              color:task.type==='work'?'#5A4F1A':P.ash,
              border:`0.5px solid ${task.type==='work'?'#B8A870':'#C8B080'}`}}>
              {task.type==='work'?'Work':'Personal'}
            </span>
            {task.recurring&&task.recurring!=='none'&&(
              <span style={{fontFamily:CP,fontSize:9,padding:'2px 6px',background:'#E0DCC4',color:'#5A4F1A',border:'0.5px solid #B8A870'}}>Recurring</span>
            )}
            {task.suggestedDay&&!task.done&&(
              <span style={{fontFamily:CP,fontSize:9,color:P.terra}}>→ {task.suggestedDay}</span>
            )}
          </div>
          {task.notes&&<div style={{fontSize:12,color:P.muted,marginTop:4,fontStyle:'italic'}}>{task.notes}</div>}
        </div>
        <button onClick={()=>onDelete(task.id)} style={{background:'none',border:'none',color:P.muted,cursor:'pointer',fontSize:16,padding:'0 2px',flexShrink:0}}>×</button>
      </div>
    </div>
  );
}

// Add task form
function AddTaskForm({onAdd}){
  const [text,setText]=useState('');
  const [priority,setPriority]=useState('mid');
  const [type,setType]=useState('personal');
  const [dueDate,setDueDate]=useState('');
  const [notes,setNotes]=useState('');
  const [recurring,setRecurring]=useState('none');
  const [open,setOpen]=useState(false);
  const PC={high:{bg:'#F0D8D4',color:'#87332B',border:'#C8A090'},mid:{bg:'#E8D8C4',color:P.ash,border:'#C8B080'},low:{bg:'#E0DCC4',color:'#5A5030',border:'#B8A870'}};

  const submit=()=>{
    if(!text.trim())return;
    onAdd({id:'t'+Date.now(),text:text.trim(),priority,type,dueDate:dueDate||null,
      notes:notes.trim()||null,done:false,recurring,suggestedDay:dueDate?suggestDay(dueDate):null});
    setText('');setPriority('mid');setType('personal');setDueDate('');setNotes('');setRecurring('none');setOpen(false);
  };

  return(
    <div style={{border:`0.5px solid ${P.border}`,background:P.sandCard,marginBottom:10}}>
      <div style={{display:'flex',gap:8,padding:'10px 12px',alignItems:'center'}}>
        <input value={text} onChange={e=>setText(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&!open&&submit()}
          placeholder="Add a task..."
          style={{flex:1,fontFamily:GEO,fontSize:14,fontStyle:'italic',color:`${P.ink} !important`,
            WebkitTextFillColor:P.ink,border:'none',background:'transparent',outline:'none'}}
        />
        <button onClick={()=>setOpen(o=>!o)} style={{background:'none',border:'none',color:P.muted,cursor:'pointer',fontSize:20,padding:0,flexShrink:0,lineHeight:1}}>
          {open?'−':'+'}
        </button>
      </div>
      {open&&(
        <div style={{borderTop:`0.5px solid ${P.border}`,padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
          <div>
            <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:P.muted,marginBottom:6}}>Priority</div>
            <div style={{display:'flex',gap:4}}>
              {['high','mid','low'].map(p=>(
                <button key={p} onClick={()=>setPriority(p)} style={{
                  padding:'3px 10px',border:`0.5px solid ${priority===p?PC[p].color:P.border}`,
                  background:priority===p?PC[p].bg:'transparent',color:priority===p?PC[p].color:P.muted,
                  fontFamily:CP,fontSize:10,cursor:'pointer',fontWeight:priority===p?'bold':'normal',
                }}>{p.charAt(0).toUpperCase()+p.slice(1)}</button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:P.muted,marginBottom:6}}>Type</div>
            <div style={{display:'flex',gap:4}}>
              {[['personal','Personal'],['work','Work']].map(([v,l])=>(
                <button key={v} onClick={()=>setType(v)} style={{
                  padding:'3px 10px',border:`0.5px solid ${type===v?P.ash:P.border}`,
                  background:type===v?'#E8D8C4':'transparent',color:type===v?P.ash:P.muted,
                  fontFamily:CP,fontSize:10,cursor:'pointer',
                }}>{l}</button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:P.muted,marginBottom:6}}>Due date (optional)</div>
            <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)}
              style={{border:`0.5px solid ${P.border}`,padding:'5px 8px',fontFamily:CP,
                fontSize:12,background:'transparent',color:P.ink,outline:'none'}}/>
          </div>
          <div>
            <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:P.muted,marginBottom:6}}>Recurring</div>
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
              {[['none','One-time'],['weekly','Weekly'],['monthly-last','Monthly — last day']].map(([v,l])=>(
                <button key={v} onClick={()=>setRecurring(v)} style={{
                  padding:'3px 8px',border:`0.5px solid ${recurring===v?P.grass:P.border}`,
                  background:recurring===v?'#E0DCC4':'transparent',color:recurring===v?'#5A4F1A':P.muted,
                  fontFamily:CP,fontSize:9,cursor:'pointer',
                }}>{l}</button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:P.muted,marginBottom:6}}>Notes (optional)</div>
            <input value={notes} onChange={e=>setNotes(e.target.value)}
              placeholder="e.g. need to look up location first"
              style={{width:'100%',border:`0.5px solid ${P.border}`,padding:'5px 8px',
                fontFamily:GEO,fontSize:12,fontStyle:'italic',background:'transparent',
                color:P.ink,WebkitTextFillColor:P.ink,outline:'none'}}/>
          </div>
          <button onClick={submit} style={{
            background:P.poppy,color:'#FDF0E8',border:'none',
            padding:'9px',fontFamily:CP,fontSize:12,cursor:'pointer',letterSpacing:'0.06em',
          }}>Add task</button>
        </div>
      )}
    </div>
  );
}

// Intention prompt
function IntentionPrompt({value,onChange}){
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState(value||'');
  const save=()=>{if(draft.trim()){onChange(draft.trim());setEditing(false);}};
  return(
    <div style={{background:P.sandCard,border:`1.5px solid ${P.poppy}`,padding:'16px 18px'}}>
      <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:P.muted,marginBottom:10}}>Today's one thing</div>
      {editing?(
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&save()}
            placeholder="What matters most today?"
            style={{flex:1,fontFamily:GEO,fontSize:14,fontStyle:'italic',
              color:P.ink,WebkitTextFillColor:P.ink,border:'none',
              borderBottom:`1px solid ${P.poppy}`,background:'transparent',padding:'4px 0',outline:'none'}}
          />
          <button onClick={save} style={{background:P.poppy,color:'#FDF0E8',border:'none',padding:'5px 12px',fontFamily:CP,fontSize:11,cursor:'pointer'}}>Set</button>
        </div>
      ):(
        <div onClick={()=>{setDraft(value||'');setEditing(true);}} style={{cursor:'pointer'}}>
          {value
            ?<div style={{fontSize:15,fontStyle:'italic',lineHeight:1.45,color:P.ink}}>{value}</div>
            :<div style={{fontSize:14,fontStyle:'italic',color:P.muted}}>Tap to set today's intention...</div>
          }
          {value&&<div style={{fontFamily:CP,fontSize:11,color:P.poppy,marginTop:6}}>edit</div>}
        </div>
      )}
    </div>
  );
}

// Main App
function App(){
  const [tab,setTab]=useState(0);
  const [dayOffset,setDayOffset]=useState(0);
  const [checks,setChecks]=useState({});
  const [tasks,setTasks]=useState([]);
  const [joyItems,setJoyItems]=useState(DEFAULT_JOY);
  const [newJoy,setNewJoy]=useState('');
  const [intention,setIntention]=useState('');
  const [lastHairWash,setLastHairWash]=useState(null);
  const [jobCount,setJobCount]=useState({week:getWeekKey(),count:0});
  const [openBlock,setOpenBlock]=useState(getAutoBlock());
  const [hairSheet,setHairSheet]=useState(false);
  const [taskFilter,setTaskFilter]=useState('all');
  const [taskSort,setTaskSort]=useState('priority');
  const [loaded,setLoaded]=useState(false);

  useEffect(()=>{
    (async()=>{
      try{const r=await window.storage.get('ds-checks');if(r){const p=JSON.parse(r.value);if(p.date===todayStr())setChecks(p.checks||{});}}catch(_){}
      try{const r=await window.storage.get('ds-tasks');if(r)setTasks(JSON.parse(r.value));}catch(_){}
      try{const r=await window.storage.get('ds-joy');if(r){const parsed=JSON.parse(r.value);if(parsed.length>0&&typeof parsed[0]==='object'&&parsed[0].text){setJoyItems(parsed.map(function(i){return i.text;}));}else{setJoyItems(parsed);}}}catch(_){}
      try{const r=await window.storage.get('ds-intention');if(r){const p=JSON.parse(r.value);if(p.date===todayStr())setIntention(p.text||'');}}catch(_){}
      try{const r=await window.storage.get('ds-lasthairwash');if(r)setLastHairWash(r.value);}catch(_){}
      try{const r=await window.storage.get('ds-jobcount');if(r){const p=JSON.parse(r.value);if(p.week===getWeekKey())setJobCount(p);}}catch(_){}
      setLoaded(true);
    })();
  },[]);

  useEffect(()=>{if(!loaded)return;window.storage.set('ds-checks',JSON.stringify({date:todayStr(),checks})).catch(()=>{});},[checks,loaded]);
  useEffect(()=>{if(!loaded)return;window.storage.set('ds-tasks',JSON.stringify(tasks)).catch(()=>{});},[tasks,loaded]);
  useEffect(()=>{if(!loaded)return;window.storage.set('ds-joy',JSON.stringify(joyItems)).catch(()=>{});},[joyItems,loaded]);
  useEffect(()=>{if(!loaded)return;window.storage.set('ds-intention',JSON.stringify({date:todayStr(),text:intention})).catch(()=>{});},[intention,loaded]);
  useEffect(()=>{if(!loaded)return;window.storage.set('ds-jobcount',JSON.stringify(jobCount)).catch(()=>{});},[jobCount,loaded]);

  const toggle=useCallback(id=>setChecks(prev=>({...prev,[id]:!prev[id]})),[]);
  const toggleTask=id=>setTasks(prev=>prev.map(t=>t.id===id?{...t,done:!t.done}:t));
  const deleteTask=id=>setTasks(prev=>prev.filter(t=>t.id!==id));
  const addTask=task=>setTasks(prev=>[task,...prev]);
  const toggleBlock=id=>setOpenBlock(prev=>prev===id?null:id);
  const incJob=()=>setJobCount(prev=>({week:getWeekKey(),count:prev.week===getWeekKey()?prev.count+1:1}));

  const viewDate=addDays(new Date(),dayOffset);
  const viewDow=viewDate.getDay();
  const viewKey=dateStr(viewDate);
  const isToday=dayOffset===0;
  const isHairWashDay=viewDow===3||viewDow===5; // Wed, Fri default
  const isWeekend=viewDow===0||viewDow===6;

  const submitted=jobCount.week===getWeekKey()?jobCount.count:0;
  const jobLeft=Math.max(0,10-submitted);
  const tasksDueToday=tasks.filter(t=>!t.done&&t.dueDate===viewKey);
  const highPriOpen=tasks.filter(t=>!t.done&&t.priority==='high');
  const todayDelight=dailyDelight(joyItems,dayOffset);

  // Last day of month recurring tasks
  const today=new Date();
  const lastDay=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  const isLastDayOfMonth=today.getDate()===lastDay;

  const priOrder={high:0,mid:1,low:2};
  const filteredTasks=[...tasks]
    .filter(t=>taskFilter==='all'||t.type===taskFilter)
    .sort((a,b)=>taskSort==='priority'
      ?(priOrder[a.priority||'mid']||1)-(priOrder[b.priority||'mid']||1)
      :(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));

  // Build block items
  function blockItems(blockId){
    const pfx=`${viewKey}-${blockId}`;
    if(blockId==='morning'){
      return[
        {id:`${pfx}-wake`,text:'Wake up + out of bed'},
        {id:`${pfx}-teeth`,text:'Brush teeth'},
        {id:`${pfx}-skin`,text:'AM skincare'},
        {id:`${pfx}-meds`,text:'Medication',note:'30-60 min before eating or drinking'},
        {id:`${pfx}-workout`,text:'Workout — treadmill or hoop'},
        isHairWashDay
          ?{id:`${pfx}-hair`,text:'Hair wash shower',isHairWash:true}
          :{id:`${pfx}-shower`,text:'Shower'},
        {id:`${pfx}-lotion`,text:'Lotion + body care'},
        {id:`${pfx}-bfast`,text:'Eat a healthy breakfast'},
        {id:`${pfx}-vits`,text:'Vitamins'},
        {id:`${pfx}-water`,text:'First bottle of water'},
      ];
    }
    if(blockId==='work'){
      const wt=tasks.filter(t=>!t.done&&t.type==='work');
      return[
        {id:`${pfx}-search`,text:'Job search — triage new listings'},
        {id:`${pfx}-app`,text:'Submit one job application'},
        ...wt.map(t=>({id:`${pfx}-wt-${t.id}`,text:t.text})),
      ];
    }
    if(blockId==='life'){
      const pt=tasks.filter(t=>!t.done&&t.type==='personal'&&(t.dueDate===viewKey||!t.dueDate));
      return[
        {id:`${pfx}-admin`,text:'Life admin — pick one task to complete or advance'},
        ...pt.slice(0,4).map(t=>({id:`${pfx}-lt-${t.id}`,text:t.text})),
      ];
    }
    if(blockId==='leisure'){
      return todayDelight?[{id:`${pfx}-delight`,text:todayDelight,isDelight:true}]:[];
    }
    if(blockId==='bedtime'){
      return[
        {id:`${pfx}-bt-teeth`,text:'Brush teeth'},
        {id:`${pfx}-bt-skin`,text:'PM skincare'},
        {id:`${pfx}-bt-meds`,text:'Meds'},
        {id:`${pfx}-bt-deo`,text:'Deodorant'},
        {id:`${pfx}-bt-serum`,text:'Hair serum on scalp'},
        {id:`${pfx}-bt-vits`,text:'Vitamins'},
        {id:`${pfx}-bt-lotion`,text:'Hand lotion'},
      ];
    }
    return[];
  }

  return(
    <div style={{fontFamily:GEO,color:P.ink,background:P.sand,width:'100%',minHeight:'100vh',display:'flex',flexDirection:'column'}}>

      {/* TAB BAR */}
      <div style={{background:P.ash,display:'flex',paddingTop:'env(safe-area-inset-top,0px)',position:'sticky',top:0,zIndex:30,borderBottom:`1px solid ${P.ashBorder}`}}>
        {['Hello','Blocks','Tasks','Delights'].map((label,i)=>(
          <button key={label} onClick={()=>setTab(i)} style={{
            flex:1,padding:'11px 0',background:'none',border:'none',
            borderRight:i<3?`1px solid ${P.ashBorder}`:'none',
            borderBottom:tab===i?`2px solid ${P.poppy}`:'2px solid transparent',
            fontFamily:CP,fontSize:11,letterSpacing:'0.08em',cursor:'pointer',
            color:tab===i?P.sand2:'#9A8A5A',borderRadius:0,position:'relative',
          }}>
            {label}
            {label==='Tasks'&&highPriOpen.length>0&&(
              <span style={{position:'absolute',top:7,right:'15%',width:6,height:6,borderRadius:'50%',background:P.poppy,border:`1px solid ${P.ash}`}}/>
            )}
          </button>
        ))}
      </div>

      {/* SCREENS */}
      <div style={{flex:1}}>

        {/* HELLO */}
        {tab===0&&(
          <div style={{padding:'26px 18px 40px',backgroundImage:`linear-gradient(rgba(214,83,63,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(214,83,63,0.07) 1px,transparent 1px)`,backgroundSize:'22px 22px',backgroundColor:P.sand}}>
            <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:P.muted,marginBottom:7}}>{fmtDate(viewDate)}</div>
            <div style={{fontSize:27,fontStyle:'italic',lineHeight:1.2,marginBottom:24}}>Hello,<br/>Brittany.</div>

            <div style={{background:P.sandCard,border:`0.5px solid ${P.border}`,padding:'20px 18px',marginBottom:14}}>
              <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:P.muted,marginBottom:13}}>A note —</div>
              <div style={{fontSize:14,lineHeight:1.8}}>
                {(()=>{const dow=viewDate.getDay();const dayNotes=['Rest up — it's Sunday.','New week, fresh start.','Deep focus day.','Midweek — keep the momentum.','Almost there.','Reset and recharge.','Enjoy the weekend.'];return <div style={{marginBottom:10,color:P.muted,fontStyle:'italic',fontSize:13}}>{dayNotes[dow]}</div>;})()}
                {tasksDueToday.length>0&&(
                  <div style={{marginBottom:10}}>
                    ⚠️ {tasksDueToday.length===1
                      ?`Don't forget today: ${tasksDueToday[0].text}`
                      :`You have ${tasksDueToday.length} tasks due today.`}
                  </div>
                )}
                {isLastDayOfMonth&&(
                  <div style={{marginBottom:10}}>📅 Last day of the month — don't forget any recurring tasks.</div>
                )}
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <span>✏️ <strong style={{fontWeight:500}}>{submitted} of 10</strong> applications this week — {jobLeft} to go.</span>
                  <span onClick={incJob} style={{fontFamily:CP,fontSize:10,color:P.poppy,cursor:'pointer',border:`0.5px solid ${P.poppy}`,padding:'1px 8px'}}>+1</span>
                </div>
                {submitted>=10&&<div style={{color:P.grass,fontStyle:'italic',fontSize:13,marginTop:6}}>🎉 Weekly goal reached!</div>}
              </div>
            </div>

            <IntentionPrompt value={intention} onChange={setIntention}/>
          </div>
        )}

        {/* BLOCKS */}
        {tab===1&&(
          <div style={{padding:'14px 14px 40px'}}>
            <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:P.muted,marginBottom:14,padding:'0 2px'}}>{fmtDate(viewDate)}</div>
            {BLOCKS.map(block=>{
              const isOpen=openBlock===block.id;
              const items=blockItems(block.id);
              const doneCount=items.filter(item=>!!checks[item.id]).length;

              return(
                <div key={block.id} style={{marginBottom:5,border:`0.5px solid ${block.border}`}}>
                  <div onClick={()=>toggleBlock(block.id)} style={{background:block.bg,display:'flex',justifyContent:'space-between',alignItems:'center',padding:'15px 16px',cursor:'pointer'}}>
                    <div style={{display:'flex',alignItems:'baseline',gap:10}}>
                      <div style={{fontSize:21,fontWeight:500,color:block.txt}}>{block.label}</div>
                      {items.length>0&&(
                        <div style={{fontFamily:CP,fontSize:10,color:block.txt+'80'}}>{doneCount}/{items.length}</div>
                      )}
                    </div>
                    <div style={{fontSize:16,color:block.txt+'80',fontWeight:'bold'}}>{isOpen?'∨':'›'}</div>
                  </div>

                  {isOpen&&(
                    <div style={{background:P.sand,padding:'2px 16px 14px',borderTop:`0.5px solid ${block.border}`}}>
                      {items.length===0&&(
                        <div style={{fontFamily:CP,fontSize:12,color:P.muted,fontStyle:'italic',padding:'10px 0'}}>
                          {block.id==='leisure'?'Add items to your Delights list to get a nudge here.':'Nothing scheduled.'}
                        </div>
                      )}
                      {items.map((item,idx)=>{
                        const done=!!checks[item.id];
                        const isLast=idx===items.length-1;

                        if(item.isHairWash){
                          const nextWash=lastHairWash==='A'?'B':lastHairWash==='B'?'A':'A';
                          return(
                            <div key={item.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 0',borderBottom:isLast?'none':`0.5px solid rgba(58,42,26,0.1)`}}>
                              <div style={{display:'flex',alignItems:'center',gap:11,flex:1}} onClick={()=>toggle(item.id)}>
                                <CkBox done={done} color={block.cht}/>
                                <div>
                                  <span style={{fontSize:13,textDecoration:done?'line-through':'none',opacity:done?0.4:1}}>Hair wash shower</span>
                                  <span style={{fontFamily:CP,fontSize:9,background:block.cht+'22',color:'#87332B',padding:'2px 7px',marginLeft:6}}>
                                    {HAIR[nextWash]?.tag}
                                  </span>
                                </div>
                              </div>
                              <div onClick={()=>setHairSheet(true)} style={{padding:'4px 10px',cursor:'pointer',color:block.cht,fontSize:16,fontWeight:500}}>›</div>
                            </div>
                          );
                        }

                        if(item.isDelight){
                          return(
                            <div key={item.id} style={{display:'flex',alignItems:'flex-start',gap:11,padding:'9px 0',borderBottom:isLast?'none':`0.5px solid rgba(58,42,26,0.1)`,cursor:'pointer'}}
                              onClick={()=>{
                                if(!done){toggle(item.id);setTimeout(()=>toggle(item.id),1400);}
                              }}>
                              <CkBox done={done} color={block.cht}/>
                              <div style={{marginTop:1}}>
                                <div style={{fontSize:13,fontStyle:'italic',color:block.border}}>✦ {item.text}</div>
                                <div style={{fontFamily:CP,fontSize:9,color:P.muted,marginTop:2}}>tonight's nudge — refreshes each day</div>
                              </div>
                            </div>
                          );
                        }

                        return(
                          <CheckRow key={item.id} id={item.id} text={item.text} note={item.note}
                            color={block.cht} checks={checks} toggle={toggle} isLast={isLast}/>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* TASKS */}
        {tab===2&&(
          <div style={{padding:'14px 14px 40px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <div style={{display:'flex',gap:3}}>
                {[['all','All'],['work','Work'],['personal','Personal']].map(([v,l])=>(
                  <button key={v} onClick={()=>setTaskFilter(v)} style={{
                    fontFamily:CP,fontSize:9,padding:'3px 8px',cursor:'pointer',borderRadius:0,
                    background:taskFilter===v?P.ash:'transparent',
                    color:taskFilter===v?P.sand2:P.muted,
                    border:taskFilter===v?`0.5px solid ${P.ash}`:`0.5px solid ${P.border}`,
                  }}>{l}</button>
                ))}
              </div>
              <div style={{display:'flex',gap:3}}>
                {[['priority','Priority ↑'],['due','Due date']].map(([v,l])=>(
                  <button key={v} onClick={()=>setTaskSort(v)} style={{
                    fontFamily:CP,fontSize:9,padding:'3px 8px',cursor:'pointer',borderRadius:0,background:'transparent',
                    color:taskSort===v?P.poppy:P.muted,
                    border:taskSort===v?`0.5px solid ${P.poppy}`:`0.5px solid ${P.border}`,
                  }}>{l}</button>
                ))}
              </div>
            </div>

            <AddTaskForm onAdd={addTask}/>

            <div style={{display:'flex',flexDirection:'column',gap:5}}>
              {filteredTasks.filter(t=>!t.done).map(t=>(
                <TaskCard key={t.id} task={t} onToggle={toggleTask} onDelete={deleteTask}/>
              ))}
              {filteredTasks.filter(t=>t.done).length>0&&(
                <div>
                  <div style={{fontFamily:CP,fontSize:10,letterSpacing:'0.12em',textTransform:'uppercase',color:P.muted,margin:'14px 0 8px'}}>Done</div>
                  <div style={{display:'flex',flexDirection:'column',gap:5}}>
                    {filteredTasks.filter(t=>t.done).map(t=>(
                      <TaskCard key={t.id} task={t} onToggle={toggleTask} onDelete={deleteTask}/>
                    ))}
                  </div>
                </div>
              )}
              {filteredTasks.length===0&&(
                <div style={{textAlign:'center',color:P.muted,fontSize:14,fontStyle:'italic',marginTop:40,fontFamily:CP}}>No tasks yet. Add one above.</div>
              )}
            </div>
          </div>
        )}

        {/* DELIGHTS */}
        {tab===3&&(
          <div style={{padding:'14px 14px 40px'}}>
            <div style={{border:`0.5px solid ${P.border}`,overflow:'hidden',marginBottom:10}}>
              {joyItems.map((item,idx)=>{
                const isNudge=item===todayDelight;
                return(
                  <div key={idx} style={{fontSize:13,padding:'11px 14px',borderBottom:idx<joyItems.length-1?`0.5px solid ${P.border}`:'none',display:'flex',gap:10,alignItems:'center',background:P.sandCard}}>
                    <div style={{width:4,height:4,background:isNudge?P.poppy:P.muted,flexShrink:0}}/>
                    <span style={{flex:1}}>
                      {item}
                      {isNudge&&<span style={{fontFamily:CP,fontSize:9,color:P.muted,marginLeft:8}}>← today's nudge</span>}
                    </span>
                    <button onClick={()=>setJoyItems(prev=>prev.filter((_,i)=>i!==idx))} style={{background:'none',border:'none',color:P.muted,cursor:'pointer',fontSize:15,padding:'0 2px'}}>×</button>
                  </div>
                );
              })}
            </div>
            <div style={{border:`0.5px solid ${P.border}`,padding:'10px 12px',display:'flex',gap:8,alignItems:'center',background:P.sandCard}}>
              <span style={{color:P.muted,fontSize:16}}>+</span>
              <input value={newJoy} onChange={e=>setNewJoy(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter'&&newJoy.trim()){setJoyItems(prev=>[...prev,newJoy.trim()]);setNewJoy('');}}}
                placeholder="Add something that brings you joy..."
                style={{flex:1,fontFamily:GEO,fontSize:13,fontStyle:'italic',color:P.ink,WebkitTextFillColor:P.ink,border:'none',background:'transparent',outline:'none'}}
              />
              <button onClick={()=>{if(!newJoy.trim())return;setJoyItems(prev=>[...prev,newJoy.trim()]);setNewJoy('');}} style={{
                background:P.poppy,color:'#FDF0E8',border:'none',padding:'4px 10px',fontFamily:CP,fontSize:10,cursor:'pointer',
              }}>Add</button>
            </div>
          </div>
        )}

      </div>

      {/* FOOTER NAV */}
      <div style={{background:P.ash,display:'flex',borderTop:`1px solid ${P.ashBorder}`,position:'sticky',bottom:0,paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
        <button onClick={()=>setDayOffset(o=>Math.max(-2,o-1))} style={{flex:1,padding:'10px 0',background:'none',border:'none',borderRight:`1px solid ${P.ashBorder}`,fontFamily:CP,fontSize:13,cursor:'pointer',color:P.grass,borderRadius:0}}>‹ Back</button>
        <button onClick={()=>setDayOffset(0)} style={{flex:1,padding:'10px 0',background:'none',border:'none',borderRight:`1px solid ${P.ashBorder}`,fontFamily:CP,fontSize:10,letterSpacing:'0.14em',textTransform:'uppercase',cursor:'pointer',color:isToday?P.poppy:'#9A8A5A',borderRadius:0}}>Today</button>
        <button onClick={()=>setDayOffset(o=>Math.min(6,o+1))} style={{flex:1,padding:'10px 0',background:'none',border:'none',fontFamily:CP,fontSize:13,cursor:'pointer',color:P.grass,borderRadius:0}}>Next ›</button>
      </div>

      {hairSheet&&<HairSheet onClose={()=>setHairSheet(false)} lastHairWash={lastHairWash} setLastHairWash={setLastHairWash}/>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
