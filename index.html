    // localStorage shim matching Claude's window.storage API
    window.storage = {
      get: function(key) {
        try {
          var val = localStorage.getItem('ds_' + key);
          if (val === null) return Promise.reject(new Error('not found'));
          return Promise.resolve({ value: val });
        } catch(e) { return Promise.reject(e); }
      },
      set: function(key, value) {
        try {
          localStorage.setItem('ds_' + key, typeof value === 'string' ? value : String(value));
          return Promise.resolve({ key: key, value: value });
        } catch(e) { return Promise.reject(e); }
      }
    };
  </script>

    function dailyJoyNudge(joyItems) {
      if (!joyItems.length) return null;
      const seed = new Date().toISOString().split("T")[0].replace(/-/g,"");
      const idx  = parseInt(seed) % joyItems.length;
      return joyItems[idx];
    }

    function HairCycleBadge({ lastHairWash, compact }) {
      const next = lastHairWash === "A" ? "B" : lastHairWash === "B" ? "A" : "A";

      return (
        <div style={{ marginTop: 4, display: "inline-flex", alignItems: "center", gap: 6,
          background: proto.color + "18", borderRadius: 10, padding: "3px 10px" }}>
          <span style={{ fontSize: 11, color: proto.color, fontWeight: "bold" }}>{proto.tag}</span>
          <span style={{ fontSize: 10, color: C.muted }}>{proto.label}</span>
        </div>
      );
    }

    function IntentionPrompt({ value, onChange }) {
      const [editing, setEditing] = useState(!value);
      const [draft, setDraft] = useState(value || "");
      const save = () => { if (draft.trim()) { onChange(draft.trim()); setEditing(false); } };
      return (
        <div style={{ background: C.ink, borderRadius: 14, padding: "14px 16px", marginBottom: 20 }}>
          <div style={{ fontSize: 10, letterSpacing: "0.14em", color: C.muted, textTransform: "uppercase", marginBottom: 8 }}>

            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>

                placeholder="What matters most today?"
                style={{ flex: 1, background: "rgba(255,255,255,0.08)", border: "none",
                  borderBottom: `1px solid ${C.warm}`, padding: "6px 0", color: C.cream,
                  fontFamily: "inherit", fontSize: 14, fontStyle: "italic", outline: "none" }} />
              <button onClick={save} style={{ background: C.terracotta, color: "#fff", border: "none",
                borderRadius: 8, padding: "6px 12px", fontSize: 12, cursor: "pointer", fontFamily: "Georgia, serif" }}>
                Set
              </button>
            </div>

            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>

                edit
              </button>
            </div>
          )}

      );

    function EveningNudge({ joyItems }) {
      const hour = new Date().getHours();
      if (hour < 17 || !joyItems.length) return null;
      const nudge = dailyJoyNudge(joyItems);
      if (!nudge) return null;
      return (
        <div style={{ background: C.dustyRose+"22", border: `1px solid ${C.dustyRose+"60"}`,
          borderRadius: 12, padding: "12px 14px", marginBottom: 12 }}>
          <div style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase",
            color: C.dustyRose, marginBottom: 6 }}>✨ Tonight's joy nudge</div>
          <div style={{ fontSize: 14, color: C.ink, fontStyle: "italic", lineHeight: 1.4 }}>
            {nudge.text}
          </div>
        </div>
      );
    }

      const [hairType, setHairType] = useState(null);
      useEffect(() => {
        if (content === "hair-wash") {
          setHairType(lastHairWash === "A" ? "B" : lastHairWash === "B" ? "A" : "A");

      if (!content) return null;
      const isHair = content === "hair-wash";
      const proto  = isHair && hairType ? HAIR_PROTOCOLS[hairType] : null;
      const detail = !isHair ? DETAIL_VIEWS[content] : null;

      const handleSelectHair = (type) => {
        setHairType(type);
        setLastHairWash(type);
        window.storage.set("ds-lasthairwash", type).catch(() => {});

                    {Object.entries(HAIR_PROTOCOLS).map(([key, p]) => (

                        border: `1.5px solid ${hairType === key ? p.color : C.border}`,

                        cursor: "pointer", fontFamily: "Georgia, serif" }}>
                        <div style={{ fontSize: 11, fontWeight: "bold", color: p.color, letterSpacing: "0.06em" }}>{p.tag}</div>
                        <div style={{ fontSize: 10, color: C.muted, marginTop: 2, lineHeight: 1.3 }}>{p.label}</div>
                      </button>
                    ))}
                  </div>
                  {proto && (
                    <div>
                      <div style={{ fontSize: 12, color: C.muted, fontStyle: "italic", marginBottom: 16 }}>

                        {lastHairWash && (

        </div>
      );
    }

    function TaskCard({ task, onToggle, onDelete }) {
      const pc = PRIORITY_CONFIG[task.priority || "mid"];
      const isOverdue = task.dueDate && task.dueDate < todayKey() && !task.done;
      return (
        <div style={{ background: task.done ? "rgba(0,0,0,0.02)" : C.cardBg,
          border: `1px solid ${isOverdue ? C.red+"60" : task.done ? "transparent" : C.border}`,
          borderRadius: 12, padding: "12px 14px", opacity: task.done ? 0.5 : 1 }}>
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
            <div onClick={() => onToggle(task.id)} style={{
              width: 20, height: 20, borderRadius: 4, flexShrink: 0, marginTop: 1, cursor: "pointer",
              border: `1.5px solid ${task.done ? C.sage : C.border}`,
              background: task.done ? C.sage : "transparent",
              display: "flex", alignItems: "center", justifyContent: "center" }}>
              {task.done && <span style={{ color: "#fff", fontSize: 11 }}>✓</span>}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, lineHeight: 1.4,
                textDecoration: task.done ? "line-through" : "none", color: C.ink }}>
                {task.text}
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 5, flexWrap: "wrap", alignItems: "center" }}>
                <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 10,
                  background: pc.bg, color: pc.color, fontWeight: "bold", letterSpacing: "0.06em" }}>
                  {pc.label}
                </span>
                {task.dueDate && (
                  <span style={{ fontSize: 10, color: isOverdue ? C.red : C.muted }}>
                    {isOverdue ? "overdue · " : "due "}
                    {new Date(task.dueDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}
                  </span>
                )}
                {task.suggestedDay && !task.done && (
                  <span style={{ fontSize: 10, color: C.steel }}>→ {task.suggestedDay}</span>
                )}
              </div>
              {task.notes && (
                <div style={{ fontSize: 12, color: C.muted, marginTop: 4, fontStyle: "italic" }}>{task.notes}</div>
              )}
            </div>
            <button onClick={() => onDelete(task.id)} style={{
              background: "none", border: "none", color: C.muted,
              cursor: "pointer", fontSize: 16, padding: "0 2px", flexShrink: 0 }}>x</button>
          </div>
        </div>
      );
    }

    function AddTaskForm({ onAdd }) {
      const [text, setText]         = useState("");
      const [priority, setPriority] = useState("mid");
      const [dueDate, setDueDate]   = useState("");
      const [notes, setNotes]       = useState("");
      const [open, setOpen]         = useState(false);

      const suggestDay = (due) => {
        const d = new Date(due+"T12:00:00");
        const dow = d.getDay();
        if (dow === 1 || dow === 5) return null;
        const daysToFri = ((5-dow+7)%7)||7;
        const fri = addDays(d, -daysToFri);
        if (fri >= new Date()) return "Friday "+fri.toLocaleDateString("en-US",{month:"short",day:"numeric"});
        return null;
      };

      const submit = () => {
        if (!text.trim()) return;
        onAdd({ id: "t"+Date.now(), text: text.trim(), priority,
          dueDate: dueDate||null, notes: notes.trim()||null, done: false,
          suggestedDay: dueDate ? suggestDay(dueDate) : null });
        setText(""); setPriority("mid"); setDueDate(""); setNotes(""); setOpen(false);
      };

      return (
        <div style={{ background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 14,
          overflow: "hidden", marginBottom: 16 }}>
          <div style={{ display: "flex", gap: 8, padding: "12px 14px", alignItems: "center" }}>
            <input value={text} onChange={e => setText(e.target.value)}
              onKeyDown={e => e.key === "Enter" && !open && submit()}
              placeholder="Add a task..."
              style={{ flex: 1, border: "none", background: "transparent", fontSize: 14,
                color: C.ink, fontFamily: "inherit", outline: "none" }} />
            <button onClick={() => setOpen(o => !o)} style={{
              background: "none", border: "none", color: C.muted,
              cursor: "pointer", fontSize: 20, padding: 0 }}>{open ? "−" : "+"}</button>
          </div>
          {open && (
            <div style={{ borderTop: `1px solid ${C.border}`, padding: "12px 14px",
              display: "flex", flexDirection: "column", gap: 10 }}>
              <div>
                <div style={{ fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase",
                  color: C.muted, marginBottom: 6 }}>Priority</div>
                <div style={{ display: "flex", gap: 6 }}>
                  {["high","mid","low"].map(p => {
                    const pc = PRIORITY_CONFIG[p];
                    return (
                      <button key={p} onClick={() => setPriority(p)} style={{
                        padding: "5px 14px", borderRadius: 20,
                        border: `1.5px solid ${priority===p ? pc.color : C.border}`,
                        background: priority===p ? pc.bg : "transparent",
                        color: priority===p ? pc.color : C.muted,
                        fontSize: 12, cursor: "pointer", fontFamily: "Georgia, serif",
                        fontWeight: priority===p ? "bold" : "normal" }}>{pc.label}</button>
                    );
                  })}
                </div>
              </div>
              <div>
                <div style={{ fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase",
                  color: C.muted, marginBottom: 6 }}>Due date (optional)</div>
                <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)}
                  style={{ border: `1px solid ${C.border}`, borderRadius: 8, padding: "6px 10px",
                    fontSize: 13, fontFamily: "inherit", background: "transparent", color: C.ink, outline: "none" }} />
              </div>
              <div>
                <div style={{ fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase",
                  color: C.muted, marginBottom: 6 }}>Notes (optional)</div>
                <input value={notes} onChange={e => setNotes(e.target.value)}
                  placeholder="e.g. need to look up location first"
                  style={{ width: "100%", border: `1px solid ${C.border}`, borderRadius: 8,
                    padding: "6px 10px", fontSize: 13, fontFamily: "inherit",
                    background: "transparent", color: C.ink, outline: "none", boxSizing: "border-box" }} />
              </div>
              <button onClick={submit} style={{ background: C.terracotta, color: "#fff", border: "none",
                borderRadius: 10, padding: "9px", fontSize: 13, cursor: "pointer", fontFamily: "Georgia, serif" }}>
                Add task
              </button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [tab,          setTab]          = useState(0);
      const [checks,       setChecks]       = useState({});
      const [tasks,        setTasks]        = useState([]);
      const [joyItems,     setJoyItems]     = useState(DEFAULT_JOY);
      const [newJoy,       setNewJoy]       = useState("");
      const [sheet,        setSheet]        = useState(null);
      const [intention,    setIntention]    = useState("");
      const [lastHairWash, setLastHairWash] = useState(null);
      const [dayOffset,    setDayOffset]    = useState(0);
      const [loaded,       setLoaded]       = useState(false);

      useEffect(() => {
        (async () => {
          try { const r = await window.storage.get("ds-checks");
            if (r) { const p = JSON.parse(r.value); if (p.date===todayKey()) setChecks(p.checks||{}); }
          } catch(_) {}
          try { const r = await window.storage.get("ds-tasks");
            if (r) setTasks(JSON.parse(r.value));
          } catch(_) {}
          try { const r = await window.storage.get("ds-joy");
            if (r) setJoyItems(JSON.parse(r.value));
          } catch(_) {}
          try { const r = await window.storage.get("ds-intention");
            if (r) { const p = JSON.parse(r.value); if (p.date===todayKey()) setIntention(p.text||""); }
          } catch(_) {}
          try { const r = await window.storage.get("ds-lasthairwash");
            if (r) setLastHairWash(r.value);
          } catch(_) {}
          setLoaded(true);
        })();
      }, []);

      useEffect(() => { if (!loaded) return;
        window.storage.set("ds-checks", JSON.stringify({date:todayKey(),checks})).catch(()=>{});
      }, [checks, loaded]);
      useEffect(() => { if (!loaded) return;
        window.storage.set("ds-tasks", JSON.stringify(tasks)).catch(()=>{});
      }, [tasks, loaded]);
      useEffect(() => { if (!loaded) return;
        window.storage.set("ds-joy", JSON.stringify(joyItems)).catch(()=>{});
      }, [joyItems, loaded]);
      useEffect(() => { if (!loaded) return;
        window.storage.set("ds-intention", JSON.stringify({date:todayKey(),text:intention})).catch(()=>{});
      }, [intention, loaded]);

      const toggle     = useCallback((id) => setChecks(prev => ({...prev,[id]:!prev[id]})), []);
      const toggleTask = (id) => setTasks(prev => prev.map(t => t.id===id ? {...t,done:!t.done} : t));
      const deleteTask = (id) => setTasks(prev => prev.filter(t => t.id!==id));
      const addTask    = (task) => setTasks(prev => [task, ...prev]);

      const viewDate = addDays(new Date(), dayOffset);
      const viewDow  = viewDate.getDay();
      const viewKey  = dateKey(viewDate);
      const dayData  = SCHEDULE[viewDow] || SCHEDULE[0];
      const isToday  = dayOffset === 0;

      const dayTasks         = tasks.filter(t => !t.done && t.dueDate === viewKey);
      const highPriorityOpen = tasks.filter(t => !t.done && t.priority === "high");

      return (
        <div style={{ minHeight: "100vh", background: C.cream,
          fontFamily: "Georgia, 'Times New Roman', serif", color: C.ink }}>

          <div style={{ background: C.ink, padding: "20px 24px 0", position: "sticky", top: 0, zIndex: 10 }}>
            <div style={{ fontSize: 11, letterSpacing: "0.18em", color: C.muted,
              textTransform: "uppercase", marginBottom: 4 }}>Daily Structure</div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <button onClick={() => setDayOffset(o => Math.max(0,o-1))} style={{
                background: "none", border: "none",
                color: dayOffset > 0 ? C.muted : "transparent",
                cursor: dayOffset > 0 ? "pointer" : "default",
                fontSize: 24, padding: 0, lineHeight: 1 }}>‹</button>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 20, color: C.cream, fontStyle: "italic", letterSpacing: "-0.02em" }}>
                  {viewDate.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
                </div>
                {!isToday && (
                  <div style={{ fontSize: 11, color: C.terracotta, letterSpacing: "0.08em", marginTop: 1 }}>
                    {dayOffset === 1 ? "Tomorrow" : `In ${dayOffset} days`}
                  </div>
                )}
              </div>
              <button onClick={() => setDayOffset(o => Math.min(6,o+1))} style={{
                background: "none", border: "none",
                color: dayOffset < 6 ? C.muted : "transparent",
                cursor: dayOffset < 6 ? "pointer" : "default",
                fontSize: 24, padding: 0, lineHeight: 1 }}>›</button>
            </div>
            <div style={{ display: "flex", gap: 4, marginTop: 14, paddingBottom: 16 }}>
              {["Today","Tasks","Routines","Joy"].map((t,i) => (
                <button key={t} onClick={() => setTab(i)} style={{
                  padding: "6px 12px", borderRadius: 20, border: "none",
                  fontSize: 11, letterSpacing: "0.08em", cursor: "pointer",
                  fontFamily: "Georgia, serif",
                  background: tab===i ? C.terracotta : "rgba(255,255,255,0.08)",
                  color: tab===i ? "#fff" : C.muted, position: "relative" }}>
                  {t}
                  {t==="Tasks" && highPriorityOpen.length > 0 && (
                    <span style={{ position: "absolute", top: -2, right: -2, width: 8, height: 8,
                      borderRadius: "50%", background: C.red, border: `1.5px solid ${C.ink}` }} />
                  )}
                </button>
              ))}
            </div>
          </div>

          <div style={{ padding: "20px 20px 80px" }}>

            {tab === 0 && (
              <div>
                {isToday && <IntentionPrompt value={intention} onChange={setIntention} />}
                {isToday && <EveningNudge joyItems={joyItems} />}

                {dayData.note && (
                  <div style={{ fontSize: 12, color: C.warm, fontStyle: "italic",
                    letterSpacing: "0.06em", marginBottom: 16 }}>{dayData.note}</div>
                )}

                {dayTasks.length > 0 && (
                  <div style={{ marginBottom: 16 }}>
                    <div style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase",
                      color: C.steel, marginBottom: 8 }}>Tasks due today</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {dayTasks.map(t => (
                        <TaskCard key={t.id} task={t} onToggle={toggleTask} onDelete={deleteTask} />
                      ))}
                    </div>
                  </div>
                )}

                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                  {dayData.blocks.map((block, i) => {
                    const dotColor  = CAT_COLOR[block.cat] || CAT_COLOR.anchor;
                    const checkId   = `day-${viewKey}-${i}`;
                    const done      = !!checks[checkId];
                    const hasDetail = !!block.detail;
                    return (
                      <div key={i}
                        onClick={() => hasDetail ? setSheet(block.detail) : toggle(checkId)}
                        style={{ display: "flex", gap: 12, padding: "12px 14px", borderRadius: 10,
                          background: done ? "rgba(0,0,0,0.03)" : C.cardBg,
                          border: `1px solid ${done ? "transparent" : C.border}`,
                          cursor: "pointer", opacity: done ? 0.5 : 1, alignItems: "flex-start" }}>
                        <div style={{ minWidth: 44, fontSize: 11, color: C.muted, paddingTop: 2 }}>
                          {block.time}
                        </div>
                        <div style={{ width: 8, height: 8, borderRadius: "50%",
                          background: dotColor, marginTop: 5, flexShrink: 0 }} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 14, lineHeight: 1.4,
                            textDecoration: done ? "line-through" : "none",
                            color: block.cat === "urgent" ? C.terracotta : C.ink,
                            fontWeight: block.cat === "urgent" ? "bold" : "normal" }}>
                            {block.label}
                            {block.isHairWash && lastHairWash && !done && (
                              <HairCycleBadge lastHairWash={lastHairWash} compact={true} />
                            )}
                          </div>
                          {block.note && !block.isHairWash && (
                            <div style={{ fontSize: 11, color: C.muted, marginTop: 2, fontStyle: "italic" }}>
                              {block.note}
                            </div>
                          )}
                          {block.isHairWash && !done && (
                            <div style={{ fontSize: 11, color: C.muted, marginTop: 3, fontStyle: "italic" }}>
                              Tap to open protocol
                            </div>
                          )}
                        </div>
                        {hasDetail ? (
                          <div style={{ fontSize: 18, color: C.muted, flexShrink: 0, lineHeight: 1 }}>›</div>
                        ) : (
                          <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0,
                            border: `1.5px solid ${done ? dotColor : C.border}`,
                            background: done ? dotColor : "transparent",
                            display: "flex", alignItems: "center", justifyContent: "center", marginTop: 1 }}>
                            {done && <span style={{ color: "#fff", fontSize: 11 }}>✓</span>}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                <div style={{ marginTop: 20, display: "flex", flexWrap: "wrap", gap: 10 }}>
                  {Object.entries(CAT_COLOR).map(([key, color]) => (
                    <div key={key} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <div style={{ width: 7, height: 7, borderRadius: "50%", background: color }} />
                      <span style={{ fontSize: 10, color: C.muted, textTransform: "capitalize" }}>{key}</span>
                    </div>
                  ))}
                  <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ fontSize: 12, color: C.muted }}>›</span>
                    <span style={{ fontSize: 10, color: C.muted }}>tap for detail</span>
                  </div>
                </div>
              </div>
            )}

            {tab === 1 && (
              <div>
                <AddTaskForm onAdd={addTask} />
                {["high","mid","low"].map(pri => {
                  const filtered = tasks.filter(t => !t.done && t.priority === pri);
                  if (!filtered.length) return null;
                  const pc = PRIORITY_CONFIG[pri];
                  return (
                    <div key={pri} style={{ marginBottom: 20 }}>
                      <div style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase",
                        color: pc.color, marginBottom: 10 }}>
                        {pri === "high" ? "🔴 " : ""}{pc.label} priority
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        {filtered.map(t => (
                          <TaskCard key={t.id} task={t} onToggle={toggleTask} onDelete={deleteTask} />
                        ))}
                      </div>
                    </div>
                  );
                })}
                {tasks.filter(t => t.done).length > 0 && (
                  <div>
                    <div style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase",
                      color: C.muted, marginBottom: 10 }}>Done</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {tasks.filter(t => t.done).map(t => (
                        <TaskCard key={t.id} task={t} onToggle={toggleTask} onDelete={deleteTask} />
                      ))}
                    </div>
                  </div>
                )}
                {tasks.length === 0 && (
                  <div style={{ textAlign: "center", color: C.muted, fontSize: 14,
                    fontStyle: "italic", marginTop: 40 }}>No tasks yet. Add one above.</div>
                )}
              </div>
            )}

            {tab === 2 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ fontSize: 12, color: C.muted, fontStyle: "italic", marginBottom: 4 }}>
                  Reference only — tap to read, then check the block on Today.
                </div>
                <div style={{ background: C.cardBg, border: `1px solid ${C.border}`,
                  borderRadius: 14, overflow: "hidden" }}>
                  <div style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`,
                    display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 18 }}>💆</span>
                      <span style={{ fontSize: 14, fontWeight: "bold" }}>Hair Wash Protocols</span>
                    </div>
                    {lastHairWash && <HairCycleBadge lastHairWash={lastHairWash} compact={false} />}
                  </div>
                  <div style={{ display: "flex" }}>
                    {Object.entries(HAIR_PROTOCOLS).map(([key, p], idx) => (
                      <button key={key} onClick={() => setSheet("hair-wash")} style={{
                        flex: 1, padding: "12px 8px", background: "transparent", border: "none",
                        borderRight: idx < 2 ? `1px solid ${C.border}` : "none",
                        cursor: "pointer", fontFamily: "Georgia, serif" }}>
                        <div style={{ fontSize: 11, fontWeight: "bold", color: p.color }}>{p.tag}</div>
                        <div style={{ fontSize: 10, color: C.muted, marginTop: 3, lineHeight: 1.3 }}>{p.label}</div>
                      </button>
                    ))}
                  </div>
                </div>
                {Object.entries(DETAIL_VIEWS).map(([key, d]) => (
                  <div key={key} onClick={() => setSheet(key)} style={{
                    background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 14,
                    padding: "12px 16px", cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 20 }}>{d.emoji}</span>
                      <span style={{ fontSize: 14, fontWeight: "bold" }}>{d.title}</span>
                    </div>
                    <span style={{ fontSize: 18, color: C.muted }}>›</span>
                  </div>
                ))}
              </div>
            )}

            {tab === 3 && (
              <div>
                <div style={{ fontSize: 13, color: C.warm, fontStyle: "italic",
                  marginBottom: 20, lineHeight: 1.6 }}>
                  No deadlines. No urgency. A living list of things that make you happy —
                  the app will nudge you toward one each evening.
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
                  {joyItems.map((item) => {
                    const isNudge = dailyJoyNudge(joyItems) && dailyJoyNudge(joyItems).id === item.id;
                    return (
                      <div key={item.id} style={{
                        display: "flex", alignItems: "center", gap: 10, padding: "11px 14px",
                        borderRadius: 10, background: C.cardBg,
                        border: `1px solid ${isNudge ? C.dustyRose+"80" : C.border}` }}>
                        <div style={{ width: 7, height: 7, borderRadius: "50%", flexShrink: 0,
                          background: isNudge ? C.dustyRose : C.muted }} />
                        <span style={{ flex: 1, fontSize: 13, lineHeight: 1.45, color: C.ink }}>
                          {item.text}
                          {isNudge && (
                            <span style={{ fontSize: 10, color: C.dustyRose,
                              marginLeft: 8, fontStyle: "italic" }}>tonight's nudge</span>
                          )}
                        </span>
                        <button onClick={() => setJoyItems(prev => prev.filter(j => j.id !== item.id))}
                          style={{ background: "none", border: "none", color: C.muted,
                            cursor: "pointer", fontSize: 16, padding: "0 2px" }}>x</button>
                      </div>
                    );
                  })}
                </div>
                <div style={{ background: C.cardBg, border: `1px solid ${C.border}`,
                  borderRadius: 12, padding: "12px 14px", display: "flex", gap: 8, alignItems: "center" }}>
                  <input value={newJoy} onChange={e => setNewJoy(e.target.value)}
                    onKeyDown={e => {
                      if (e.key === "Enter" && newJoy.trim()) {
                        setJoyItems(prev => [...prev, {id:"j"+Date.now(),text:newJoy.trim()}]);
                        setNewJoy("");
                      }
                    }}
                    placeholder="Add something that brings you joy..."
                    style={{ flex: 1, border: "none", background: "transparent",
                      fontSize: 13, color: C.ink, fontFamily: "inherit", outline: "none" }} />
                  <button onClick={() => {
                    if (!newJoy.trim()) return;
                    setJoyItems(prev => [...prev, {id:"j"+Date.now(),text:newJoy.trim()}]);
                    setNewJoy("");
                  }} style={{ background: C.terracotta, color: "#fff", border: "none",
                    borderRadius: 8, padding: "6px 14px", fontSize: 12,
                    cursor: "pointer", fontFamily: "Georgia, serif" }}>Add</button>
                </div>
                <div style={{ fontSize: 11, color: C.muted, fontStyle: "italic",
                  marginTop: 12, textAlign: "center" }}>
                  The evening nudge rotates daily through your list automatically.
                </div>
              </div>
            )}
          </div>

          {sheet && (
            <BottomSheet content={sheet} onClose={() => setSheet(null)}
              lastHairWash={lastHairWash} setLastHairWash={setLastHairWash} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
